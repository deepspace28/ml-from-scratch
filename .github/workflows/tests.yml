name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # torch-free subset: micrograd engine/nn, the BPE tokenizer, and the
      # classical ML models run on the stdlib + nothing (knn/tree use numpy,
      # which is pulled in below), so CI stays fast.
      - run: python -m pip install pytest numpy
      - run: python -m pytest tests/ classical/ -q
        env:
          PYTHONPATH: ${{ github.workspace }}/micrograd:${{ github.workspace }}/tokenizers:${{ github.workspace }}/classical
